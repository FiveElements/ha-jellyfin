rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: Sessions are polled every 5 s by default (configurable 2-300 s); playback position needs that resolution and one request per poll is cheap.
  brands:
    status: done
    comment: Brand images ship in custom_components/jellyfin_control/brand/ and icon.png at the repository root is the HACS listing.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: The integration has no PyPI dependency; its REST client (api.py) is part of the integration and uses aiohttp from Home Assistant.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers; media player state changes are the triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Jellyfin announces itself only on UDP 7359 by broadcast reply, which Home Assistant has no discovery helper for.
  discovery:
    status: exempt
    comment: Jellyfin announces itself only on UDP 7359 by broadcast reply, which Home Assistant has no discovery helper for.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class:
    status: exempt
    comment: No device class fits a session count or a Jellyfin client; media players are left without one because a client can be a TV, a phone or a browser.
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Every failure the user can fix is a reauthentication (token revoked) or a reconfiguration (address changed), both handled by their flows.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
